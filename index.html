    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      No `maximum-scale` / `user-scalable=no`: the redesign requires the app to
      stay usable at 200% zoom (docs/5. frontend-redesign-plan.md §8).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Dark mode is explicitly out of scope (§12), so declare the single light
      scheme. Without this the UA paints form controls, scrollbars and the
      <dialog> backdrop with dark defaults on a dark-preference device, against a
      page that is committed to warm paper.
    -->
    <meta name="color-scheme" content="light" />
    <!-- Matches --color-canvas so the browser chrome continues the app surface. -->
    <meta name="theme-color" content="#f1eee7" />
    <!-- Preconnect absorbs DNS+TLS before the stylesheet request, avoiding the @import discovery waterfall. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <title>가계부</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
